<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Place order in Kite</title>
<style>
  body { font-family: -apple-system, system-ui, sans-serif; max-width: 460px; margin: 0 auto; padding: 28px 18px; color: #1a1a1a; }
  h2 { margin: 0 0 6px; }
  .sub { color: #666; font-size: 14px; margin-bottom: 18px; }
  .card { background: #f5f6f8; border-radius: 12px; padding: 16px; font-size: 16px; line-height: 1.7; }
  .k { color: #888; }
  button { width: 100%; margin-top: 18px; font-size: 18px; font-weight: 600; padding: 15px; border: 0;
           border-radius: 12px; background: #ff5722; color: #fff; }
  .note { font-size: 12px; color: #999; margin-top: 14px; text-align: center; }
  .err { color: #c62828; }
</style>
</head>
<body>
  <h2>Order ready for Kite</h2>
  <div class="sub">Review below, then tap to open it pre-filled in Kite. You place it.</div>
  <div class="card" id="preview">Reading order…</div>

  <!-- Offsite basket POST: opens Kite with the order pre-filled; the USER reviews & places. -->
  <form id="f" method="POST" action="https://kite.zerodha.com/connect/basket">
    <input type="hidden" name="api_key" value="__API_KEY__">
    <input type="hidden" name="data" id="data">
    <button type="submit">Open in Kite →</button>
  </form>
  <div class="note" id="note">If Kite doesn't open automatically, tap the button.</div>

<script>
(function () {
  var p = new URLSearchParams(location.hash.slice(1));
  var sym = p.get('tradingsymbol') || '';
  var order = {
    variety: p.get('variety') || 'regular',
    exchange: p.get('exchange') || 'NFO',
    tradingsymbol: sym,
    transaction_type: (p.get('transaction_type') || 'BUY').toUpperCase(),
    order_type: (p.get('order_type') || 'LIMIT').toUpperCase(),
    quantity: parseInt(p.get('quantity') || '0', 10),
    price: parseFloat(p.get('price') || '0'),
    product: (p.get('product') || 'MIS').toUpperCase(),
    validity: 'DAY'
  };
  if (p.get('trigger_price')) order.trigger_price = parseFloat(p.get('trigger_price'));

  var pv = document.getElementById('preview');
  if (!sym || !order.quantity) {
    pv.innerHTML = '<span class="err">No order in the link.</span> Open the exact link sent to you.';
    document.getElementById('f').style.display = 'none';
    return;
  }
  pv.innerHTML =
    '<div><span class="k">Symbol</span> &nbsp;<b>' + order.tradingsymbol + '</b> (' + order.exchange + ')</div>' +
    '<div><span class="k">Side</span> &nbsp;<b>' + order.transaction_type + '</b> &nbsp; <span class="k">Product</span> ' + order.product + '</div>' +
    '<div><span class="k">Qty</span> &nbsp;<b>' + order.quantity + '</b></div>' +
    '<div><span class="k">Type</span> &nbsp;' + order.order_type + (order.order_type === 'LIMIT' ? ' @ ₹' + order.price : '') + '</div>' +
    (order.trigger_price ? '<div><span class="k">Trigger</span> &nbsp;₹' + order.trigger_price + '</div>' : '');

  document.getElementById('data').value = JSON.stringify([order]);

  // Auto-submit so it's truly one tap (the tap on the Telegram link). User still confirms in Kite.
  setTimeout(function () { try { document.getElementById('f').submit(); } catch (e) {} }, 400);
})();
</script>
</body>
</html>
