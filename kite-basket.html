<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Place basket in Kite</title>
<style>
  body { font-family: -apple-system, system-ui, sans-serif; max-width: 460px; margin: 0 auto; padding: 28px 18px; color: #1a1a1a; }
  h2 { margin: 0 0 6px; }
  .sub { color: #666; font-size: 14px; margin-bottom: 18px; }
  .card { background: #f5f6f8; border-radius: 12px; padding: 14px 16px; font-size: 15px; line-height: 1.6; margin-bottom: 10px; }
  .leg { border-left: 3px solid #ff5722; padding-left: 10px; margin: 10px 0; }
  .k { color: #888; }
  .buy { color: #2e7d32; font-weight: 600; } .sell { color: #c62828; font-weight: 600; }
  button { width: 100%; margin-top: 18px; font-size: 18px; font-weight: 600; padding: 15px; border: 0;
           border-radius: 12px; background: #ff5722; color: #fff; }
  .note { font-size: 12px; color: #999; margin-top: 14px; text-align: center; }
  .err { color: #c62828; }
</style>
</head>
<body>
  <h2>Basket ready for Kite</h2>
  <div class="sub">Review all legs below, then tap to open them pre-filled in Kite. You place them.</div>
  <div id="preview">Reading basket…</div>

  <!-- Offsite multi-leg basket POST: opens Kite with ALL legs pre-filled; the USER reviews & places. -->
  <form id="f" method="POST" action="https://kite.zerodha.com/connect/basket">
    <input type="hidden" name="api_key" value="1yow07entdqzh05a">
    <input type="hidden" name="data" id="data">
    <button type="submit">Open basket in Kite →</button>
  </form>
  <div class="note" id="note">If Kite doesn't open automatically, tap the button.</div>

<script>
(function () {
  var p = new URLSearchParams(location.hash.slice(1));
  var legs = [];
  try { legs = JSON.parse(p.get('b') || '[]'); } catch (e) { legs = []; }

  var pv = document.getElementById('preview');
  if (!Array.isArray(legs) || !legs.length) {
    pv.innerHTML = '<div class="card"><span class="err">No basket in the link.</span> Open the exact link sent to you.</div>';
    document.getElementById('f').style.display = 'none';
    return;
  }

  // Normalize each leg to the Kite basket order shape.
  var orders = legs.map(function (l) {
    var o = {
      variety: l.variety || 'regular',
      exchange: l.exchange || 'NFO',
      tradingsymbol: l.tradingsymbol || l.symbol || '',
      transaction_type: (l.transaction_type || l.side || 'BUY').toUpperCase(),
      order_type: (l.order_type || l.type || 'LIMIT').toUpperCase(),
      quantity: parseInt(l.quantity || l.qty || 0, 10),
      price: parseFloat(l.price || 0),
      product: (l.product || 'MIS').toUpperCase(),
      validity: 'DAY'
    };
    if (l.trigger_price || l.trigger) o.trigger_price = parseFloat(l.trigger_price || l.trigger);
    return o;
  });

  pv.innerHTML = '<div class="card">' + orders.map(function (o, i) {
    var cls = o.transaction_type === 'BUY' ? 'buy' : 'sell';
    return '<div class="leg"><span class="k">Leg ' + (i + 1) + '</span> <b>' + o.tradingsymbol + '</b> (' + o.exchange + ')<br>' +
      '<span class="' + cls + '">' + o.transaction_type + ' ' + o.quantity + '</span> · ' + o.order_type +
      (o.order_type === 'LIMIT' ? ' @ ₹' + o.price : '') + ' · ' + o.product +
      (o.trigger_price ? ' · trig ₹' + o.trigger_price : '') + '</div>';
  }).join('') + '</div>';

  document.getElementById('data').value = JSON.stringify(orders);
  // Auto-submit so it's one tap (the tap on the Telegram link). User still reviews & places in Kite.
  setTimeout(function () { try { document.getElementById('f').submit(); } catch (e) {} }, 500);
})();
</script>
</body>
</html>
